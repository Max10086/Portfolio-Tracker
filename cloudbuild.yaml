# Optional: use Docker builder instead of buildpacks if export EOF persists.
# Cloud Run → Edit continuous deployment → Build configuration → Cloud Build configuration file: cloudbuild.yaml
substitutions:
  _SERVICE_NAME: portfolio-tracker
  _REGION: us-central1
  _AR_REPO: cloud-run-source-deploy

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/portfolio-tracker/${_SERVICE_NAME}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/portfolio-tracker/${_SERVICE_NAME}:latest
      - .
    id: Build

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/portfolio-tracker/${_SERVICE_NAME}
    id: Push

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/portfolio-tracker/${_SERVICE_NAME}:$COMMIT_SHA
