# Cloud Run 持续部署请使用本文件，不要用 Buildpacks（export 阶段 docker.sock EOF 已知问题）。
# Console: Cloud Run → 服务 → 持续部署 → 修改 → 构建 →
#   「Cloud Build 配置文件」→ cloudbuild.yaml
substitutions:
  _SERVICE_NAME: portfolio-tracker
  _REGION: us-central1
  _AR_REPO: cloud-run-source-deploy

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/portfolio-tracker/${_SERVICE_NAME}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/portfolio-tracker/${_SERVICE_NAME}:latest
      - .
    id: Build
    timeout: 1200s

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/portfolio-tracker/${_SERVICE_NAME}
    id: Push
    waitFor: [Build]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/portfolio-tracker/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --quiet
    id: Deploy
    waitFor: [Push]

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/portfolio-tracker/${_SERVICE_NAME}:$COMMIT_SHA
